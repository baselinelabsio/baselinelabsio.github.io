# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build runtime config from repository variable API_URL (Settings → Variables).
      # config.js is gitignored so the live backend URL is not committed.
      - name: Write config.js from env
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Missing repository variable API_URL. Set it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          # Strip trailing slash so app.js can safely append paths
          API_URL="${API_URL%/}"
          printf '%s\n' \
            '// Generated by GitHub Actions from repository variable API_URL — do not edit by hand.' \
            'window.APP_CONFIG = {' \
            "  API_URL: '${API_URL}'," \
            '};' \
            > ieltify/request-account-deletion/config.js
          echo "Wrote config.js from env"

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
