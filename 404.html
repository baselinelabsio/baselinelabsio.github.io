<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — PrepMaestro</title>
  <meta name="description" content="The page you're looking for doesn't exist. Head back to PrepMaestro or explore IELTS Maestro.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/brand/prepmaestro-square.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #10415D;
      --muted: #526B7E;
      --faint: #7D93A3;
      --primary: #C59500;
      --primary-dark: #A07C00;
      --paper: #F8FAFC;
      --paper-raised: #FFFFFF;
      --line: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(60% 70% at 0% 0%, rgba(197, 149, 0, .07) 0%, transparent 55%),
        radial-gradient(55% 65% at 100% 100%, rgba(197, 149, 0, .09) 0%, transparent 60%),
        linear-gradient(135deg, #FFFBEB 0%, #F8FAFC 60%, #FEF3C7 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .nav {
      padding: 24px clamp(1.15rem, 4vw, 2.5rem);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }
    .brand img { height: 44px; width: auto; display: block; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2rem, 6vw, 4rem) clamp(1.15rem, 4vw, 2.5rem);
    }
    .error-card {
      max-width: 640px;
      text-align: center;
    }
    .error-code {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: clamp(5rem, 14vw, 9rem);
      font-weight: 800;
      letter-spacing: -4px;
      line-height: 1;
      color: var(--primary);
      margin-bottom: 1rem;
    }
    h1 {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--ink);
      margin-bottom: 1rem;
    }
    .lead {
      font-size: 1.1rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2.4rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2.4rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .95rem 1.6rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
      font-family: "Inter", sans-serif;
    }
    .btn--primary {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 6px 20px rgba(197, 149, 0, .25);
    }
    .btn--primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    .btn--ghost {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--line);
    }
    .btn--ghost:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .suggestions {
      font-size: .95rem;
      color: var(--faint);
    }
    .suggestions a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px dashed var(--faint);
    }
    .suggestions a:hover { color: var(--primary); border-color: var(--primary); }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/" aria-label="PrepMaestro home">
      <img src="/assets/brand/prepmaestro-lockup.svg?v=2" alt="PrepMaestro">
    </a>
  </nav>

  <main>
    <div class="error-card">
      <div class="error-code">404</div>
      <h1>This page took a wrong turn.</h1>
      <p class="lead">The link may have moved, or the URL might have a typo. Here's where to go next.</p>

      <div class="actions">
        <a class="btn btn--primary" href="/">Back to PrepMaestro</a>
        <a class="btn btn--ghost" href="/apps/ielts-maestro/">Explore IELTS Maestro</a>
      </div>

      <p class="suggestions">
        Need help? Email <a href="mailto:support@prepmaestro.com">support@prepmaestro.com</a>
      </p>
    </div>
  </main>
</body>
</html>
