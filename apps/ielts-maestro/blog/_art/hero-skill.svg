<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" fill="none" aria-hidden="true">
  <!-- Decorative dots -->
  <circle cx="60" cy="55" r="4" fill="#E31837" opacity="0.5"/>
  <circle cx="420" cy="60" r="3" fill="#E31837" opacity="0.6"/>
  <circle cx="80" cy="220" r="3" fill="#E31837" opacity="0.5"/>
  <circle cx="415" cy="215" r="5" fill="#E31837" opacity="0.4"/>

  <!-- 2x2 grid of skill tiles with letter + label -->
  <g transform="translate(100, 55)">
    <!-- Listening -->
    <g transform="translate(0, 0)">
      <rect width="130" height="75" rx="14" fill="#E31837" opacity="0.18"/>
      <text x="20" y="47" fill="#E31837" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="800">L</text>
      <text x="50" y="35" fill="#E31837" font-family="'SF Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.5">LISTENING</text>
      <rect x="52" y="42" width="52" height="4" rx="2" fill="#E31837" opacity="0.4"/>
      <rect x="52" y="42" width="42" height="4" rx="2" fill="#E31837"/>
    </g>
    <!-- Reading -->
    <g transform="translate(150, 0)">
      <rect width="130" height="75" rx="14" fill="#E31837" opacity="0.25"/>
      <text x="20" y="47" fill="#E31837" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="800">R</text>
      <text x="50" y="35" fill="#E31837" font-family="'SF Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.5">READING</text>
      <rect x="52" y="42" width="52" height="4" rx="2" fill="#E31837" opacity="0.4"/>
      <rect x="52" y="42" width="46" height="4" rx="2" fill="#E31837"/>
    </g>
    <!-- Writing -->
    <g transform="translate(0, 90)">
      <rect width="130" height="75" rx="14" fill="#E31837" opacity="0.4"/>
      <text x="20" y="47" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="800">W</text>
      <text x="50" y="35" fill="#FFFFFF" font-family="'SF Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.5">WRITING</text>
      <rect x="52" y="42" width="52" height="4" rx="2" fill="#FFFFFF" opacity="0.4"/>
      <rect x="52" y="42" width="38" height="4" rx="2" fill="#FFFFFF"/>
    </g>
    <!-- Speaking -->
    <g transform="translate(150, 90)">
      <rect width="130" height="75" rx="14" fill="#E31837"/>
      <text x="20" y="47" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="800">S</text>
      <text x="50" y="35" fill="#FFFFFF" font-family="'SF Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.5">SPEAKING</text>
      <rect x="52" y="42" width="52" height="4" rx="2" fill="#FFFFFF" opacity="0.4"/>
      <rect x="52" y="42" width="48" height="4" rx="2" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
