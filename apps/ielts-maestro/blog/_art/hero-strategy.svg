<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" fill="none" aria-hidden="true">
  <!-- Decorative dots -->
  <circle cx="60" cy="55" r="4" fill="#E31837" opacity="0.5"/>
  <circle cx="420" cy="60" r="3" fill="#E31837" opacity="0.6"/>
  <circle cx="80" cy="220" r="3" fill="#E31837" opacity="0.5"/>
  <circle cx="415" cy="215" r="5" fill="#E31837" opacity="0.4"/>

  <!-- Calendar card -->
  <g transform="translate(165, 45)">
    <rect width="150" height="175" rx="14" fill="#FFFFFF"/>
    <rect width="150" height="175" rx="14" stroke="#E31837" stroke-width="2" opacity="0.35"/>
    <!-- Header bar -->
    <path d="M 0 14 a 14 14 0 0 1 14 -14 h 122 a 14 14 0 0 1 14 14 v 24 h -150 z" fill="#E31837" opacity="0.9"/>
    <circle cx="26" cy="18" r="3.5" fill="#FFFFFF"/>
    <circle cx="124" cy="18" r="3.5" fill="#FFFFFF"/>
    <text x="75" y="30" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">4-WEEK PLAN</text>

    <!-- Day grid (5 cols x 4 rows) -->
    <g transform="translate(18, 55)" fill="#E31837">
      <circle cx="0" cy="0" r="5"/>
      <circle cx="29" cy="0" r="5"/>
      <circle cx="58" cy="0" r="5"/>
      <circle cx="87" cy="0" r="5"/>
      <circle cx="116" cy="0" r="5"/>
      <circle cx="0" cy="25" r="5"/>
      <circle cx="29" cy="25" r="5"/>
      <circle cx="58" cy="25" r="5"/>
      <circle cx="87" cy="25" r="5" opacity="0.35"/>
      <circle cx="116" cy="25" r="5" opacity="0.35"/>
      <circle cx="0" cy="50" r="5"/>
      <circle cx="29" cy="50" r="5" opacity="0.35"/>
      <circle cx="58" cy="50" r="5" opacity="0.35"/>
      <circle cx="87" cy="50" r="5" opacity="0.35"/>
      <circle cx="116" cy="50" r="5" opacity="0.35"/>
      <circle cx="0" cy="75" r="5" opacity="0.35"/>
      <circle cx="29" cy="75" r="5" opacity="0.35"/>
      <circle cx="58" cy="75" r="5" opacity="0.35"/>
      <circle cx="87" cy="75" r="5" opacity="0.35"/>
      <circle cx="116" cy="75" r="5" opacity="0.35"/>
    </g>

    <!-- Progress badge -->
    <g transform="translate(120, 128)">
      <circle r="28" fill="#E31837"/>
      <path d="M -11 1 L -3 9 L 12 -8" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>
