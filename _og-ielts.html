<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG — IELTS Maestro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
      background:
        radial-gradient(60% 70% at 100% 0%, rgba(227, 24, 55, .09) 0%, transparent 55%),
        radial-gradient(55% 65% at 0% 100%, rgba(227, 24, 55, .07) 0%, transparent 60%),
        linear-gradient(135deg, #FFF7F9 0%, #FDE8EC 100%);
      color: #10415D;
      padding: 70px 90px;
      position: relative;
    }
    .top-accent {
      position: absolute; top: 0; left: 0; right: 0;
      height: 10px;
      background: linear-gradient(90deg, #F02842, #E31837);
    }
    .lockup { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
    .lockup-icon {
      width: 100px; height: 100px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(16, 65, 93, .08);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .lockup-icon svg { width: 70px; height: 70px; }
    .lockup-text { display: flex; flex-direction: column; line-height: 1.1; }
    .lockup-name {
      font-weight: 800;
      font-size: 36px;
      letter-spacing: -0.5px;
      color: #10415D;
    }
    .lockup-tag {
      margin-top: 4px;
      color: #526B7E;
      font-size: 20px;
      font-weight: 500;
    }
    h1 {
      font-weight: 800;
      font-size: 82px;
      line-height: 1.02;
      letter-spacing: -2.5px;
      color: #10415D;
      max-width: 1050px;
    }
    h1 .accent {
      color: #E31837;
      position: relative;
      display: inline-block;
    }
    h1 .accent::after {
      content: "";
      position: absolute;
      left: 0; right: 0;
      bottom: -10px;
      height: 8px;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 12' preserveAspectRatio='none'><path d='M3 7 C 60 2, 120 10, 180 5 S 280 9, 297 4' stroke='%23E31837' stroke-width='2.5' stroke-linecap='round' fill='none' vector-effect='non-scaling-stroke'/></svg>") no-repeat center / 100% 100%;
    }
    .domain {
      position: absolute;
      bottom: 36px; left: 90px;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #E31837;
    }
  </style>
</head>
<body>
  <div class="top-accent"></div>
  <div class="lockup">
    <div class="lockup-icon">
      <img src="/assets/brand/ieltsmaestro-square.svg" alt="" style="width:88px;height:88px">
    </div>
    <div class="lockup-text">
      <span class="lockup-name">IELTS Maestro</span>
      <span class="lockup-tag">Prep Like a Pro</span>
    </div>
  </div>
  <h1>Complete AI IELTS<br>Band Score Coach<br><span class="accent">in Your Pocket</span>.</h1>
  <div class="domain">PREPMAESTRO.COM/APPS/IELTS-MAESTRO</div>
</body>
</html>
