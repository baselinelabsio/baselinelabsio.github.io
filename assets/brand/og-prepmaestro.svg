<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="60%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#C59500"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative background shapes -->
  <circle cx="1050" cy="120" r="180" fill="#C59500" opacity="0.08"/>
  <circle cx="150" cy="520" r="140" fill="#C59500" opacity="0.08"/>
  <circle cx="1100" cy="520" r="90" fill="#D4A017" opacity="0.12"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)"/>

  <!-- Centered content group -->
  <g transform="translate(600, 90)">
    <!-- Mascot icon (centered horizontally in the card) -->
    <g transform="translate(-110, 0)">
      <circle cx="55" cy="55" r="48" fill="#10415D"/>
      <circle cx="165" cy="55" r="48" fill="#10415D"/>
      <ellipse cx="62" cy="42" rx="20" ry="15" fill="#FFFFFE" transform="rotate(42 62 42)"/>
      <ellipse cx="158" cy="42" rx="20" ry="15" fill="#FFFFFE" transform="rotate(-42 158 42)"/>
      <path d="M -8 150 L 228 150 L 215 175 L 5 175 Z" fill="#C59500"/>
      <path d="M 90 180 L 130 180 L 110 215 Z" fill="#C59500"/>
    </g>
  </g>

  <!-- Brand name centered -->
  <text x="600" y="380" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="68" font-weight="800" fill="#10415D" letter-spacing="-2">PrepMaestro</text>

  <!-- Two-line headline centered -->
  <text x="600" y="450" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#10415D">Conduct Your Prep. <tspan fill="#C59500">Master Your Score.</tspan></text>

  <!-- Divider dot -->
  <circle cx="600" cy="490" r="4" fill="#C59500"/>

  <!-- Subhead centered -->
  <text x="600" y="535" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="500" fill="#526B7E">AI-powered exam practice · IELTS live · SAT · TOEFL · GRE · PTE coming</text>

  <!-- Domain centered -->
  <text x="600" y="595" text-anchor="middle" font-family="Space Mono, Menlo, monospace" font-size="18" font-weight="700" fill="#C59500" letter-spacing="2">PREPMAESTRO.COM</text>
</svg>
